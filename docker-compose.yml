services:
  web:
    build: .
    container_name: placarapp-backend
    command: >
      sh -c "uv run python src/manage.py migrate &&
            uv run python src/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - UV_PROJECT_ENVIRONMENT=/opt/venv